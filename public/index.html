<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chargers" />
    <title>Chargers</title>
    <meta name="description" content="Public EV chargers in Singapore. Distance, price, and status from LTA." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="title-row">
          <h1>Chargers</h1>
          <div class="view-switch" role="group" aria-label="View">
            <button type="button" id="view-list" aria-pressed="true">List</button>
            <button type="button" id="view-map" aria-pressed="false">Map</button>
          </div>
        </div>
        <form id="search-form" role="search">
          <label class="sr" for="search">Postal code or place</label>
          <input
            id="search"
            type="search"
            placeholder="Postal code or place"
            autocomplete="off"
            enterkeyhint="search"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="suggestions"
          />
          <ul id="suggestions" role="listbox" hidden></ul>
        </form>
        <div class="tools">
          <label class="sort">
            Sort
            <select id="sort">
              <option value="nearest">Nearest</option>
              <option value="cheap">Cheap nearby</option>
              <option value="price">Lowest price</option>
              <option value="free">Most free</option>
              <option value="operator">Operator</option>
            </select>
          </label>
          <button type="button" id="operators" aria-expanded="false" aria-pressed="false" aria-controls="operator-panel">Operators</button>
        </div>
        <div id="operator-panel" class="operator-panel" hidden></div>
        <div class="chips">
          <button type="button" id="near" aria-pressed="false">Near me</button>
          <button type="button" id="filter-free" aria-pressed="false">Free now</button>
          <button type="button" id="filter-dc" aria-pressed="false">DC</button>
          <button type="button" id="filter-ccs" aria-pressed="false">CCS2</button>
          <button type="button" id="filter-type2" aria-pressed="false">Type 2</button>
        </div>
        <p id="banner" class="banner" role="status"></p>
        <p id="context" class="context"></p>
      </header>
      <main id="main"></main>
      <footer>
        <p>Your location stays on this phone.</p>
        <p id="source-note"></p>
        <p id="install"></p>
      </footer>
    </div>
    <section id="detail" hidden></section>
    <script type="module" src="app.js"></script>
  </body>
</html>
